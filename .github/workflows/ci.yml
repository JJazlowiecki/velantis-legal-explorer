name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: velantis_test
          POSTGRES_USER: velantis
          POSTGRES_PASSWORD: velantis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velantis -d velantis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: velantis_test
      POSTGRES_USER: velantis
      POSTGRES_PASSWORD: velantis
      DATABASE_URL: postgresql://velantis:velantis@localhost:5432/velantis_test
      # A distinct disposable database on the same throwaway CI Postgres service.
      # Kept a different name (not just a different env var pointing at the same
      # database) so the "TEST_DATABASE_URL !== DATABASE_URL" safety guard in the
      # integration tests holds in CI too, not just locally.
      TEST_DATABASE_URL: postgresql://velantis:velantis@localhost:5432/velantis_test_integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test integration database
        run: PGPASSWORD=velantis psql -h localhost -U velantis -d velantis_test -c 'CREATE DATABASE velantis_test_integration;'

      - name: Run migrations (app database)
        run: pnpm db:migrate

      - name: Run migrations (test database)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
